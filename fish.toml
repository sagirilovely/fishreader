# fish.toml — fishreader 配置
# 首次启动自动生成；修改后重启生效。未知的键会被忽略。

[books]
scan_dirs = ["books"]              # 扫描目录（相对项目根，可多个）
extensions = [".epub", ".mobi", ".txt"]
allow_kindleunpack = false          # MOBI 解析失败时是否尝试外部 kindleunpack CLI

[reader]
# 以下设置可在终端内按 s 打开设置菜单实时调整，改完自动写回本文件
font_size = "medium" # small | medium | large（显示密度档位，不改终端真实字号）
line_spacing = 0.25 # 行距（行后额外"行数"，0 或 0.25~2 小数；0 = 跟随 font_size）
paragraph_spacing = 0.25 # 段距（段落后额外"行数"，同上）
reader_width = "30%"               # 阅读区占终端宽度百分比（25%-40%）或固定列数
reader_position = "right" # left | right | bottom（底部时阅读区占满宽度）
novel_style = "markdown" # markdown | comment | docstring
resume_last = true                 # 启动时自动续读上次书籍

[disguise]
agent_name = "CodeAgent"
agent_version = "0.4.2"
log_interval_min = 0.8             # 假日志间隔（秒）
log_interval_max = 1.5
log_style = "npm" # agent | vite | npm | git（伪装日志风格，均只输出英文）
status_line = "minimal"            # minimal | full
boss_key = "b"                     # 老板键
full_hide_chinese = true           # 老板模式下过滤 CJK 字符

[web]
enabled = true                     # 启动终端摸鱼时是否同时启动网页伪装服务
port = 8080                        # 网页服务端口（端口被占用时自动递增尝试）
host = "127.0.0.1"                 # 监听地址
auto_open = true                   # 启动时是否自动在默认浏览器打开
theme = "vue"                      # 默认技术文档主题: vue | react | rust | python
disguise_mode = "hybrid"           # 网页排版伪装度: clean | hybrid | code_dense
video_enabled = true               # 网页右下角悬浮广告/视频播放伪装组件
video_position = "bottom_right"    # bottom_right (右下角悬浮) | sidebar (侧边栏内嵌)
video_default_size = "normal"      # small (200px) | normal (280px) | large (380px) | xl (480px)
ad_style = "flashy_game"           # 垃圾广告伪装样式: flashy_game | tech_course | cloud_sale | vue_sponsor
auto_pause_on_boss = true          # 按下老板键时自动暂停视频并切换为高亮闪烁广告

[theme]
log_level_color = true             # 日志级别着色（INFO/WARN/OK）
reader_color = "gray"              # 阅读区颜色
accent = "green"

[progress]
file = ".fish_progress.json"
autosave_on_page = true            # 翻页即保存进度；false 时仅退出保存

