<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">响应式基础 | Vue.js</title>

  <link rel="stylesheet" href="style.css">

<body data-theme="vue" data-mode="light">
  <div id="app" class="doc-layout">
    
    <!-- Top Navigation Bar -->
    <header id="top-nav" class="navbar">
      <div class="nav-left">
        <button id="mobile-menu-btn" class="icon-btn mobile-only" aria-label="Toggle menu">

        <div id="brand-logo" class="brand" title="Double click for Boss Mode (Esc / b)">
          <div id="brand-icon" class="brand-svg-container"></div>
          <span id="brand-text" class="brand-name">Vue.js</span>
        </div>

        <div class="search-bar" id="search-trigger">
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <span class="search-text">搜索</span>
          <kbd class="search-kbd">⌘ K</kbd>
        </div>
      </div>

      <div class="nav-center nav-links-group desktop-only">
        <a href="#doc" class="nav-link active" id="nav-doc-link">文档 <span class="arrow">▾</span></a>
        <a href="#play" class="nav-link" id="nav-play-link">演练场</a>
        <a href="#ecosystem" class="nav-link">生态系统 <span class="arrow">▾</span></a>
        <a href="#about" class="nav-link">关于 <span class="arrow">▾</span></a>
        <a href="#support" class="nav-link">支持 <span class="arrow">▾</span></a>
      </div>

      <div class="nav-right">
        <!-- Documentation Theme Switcher Dropdown -->
        <div class="theme-picker-wrapper">
          <select id="doc-theme-select" class="theme-select" title="切换伪装文档体系">
            <option value="vue">Vue 3 (VitePress)</option>
            <option value="react">React (react.dev)</option>
            <option value="rust">Rust (mdBook)</option>
            <option value="python">Python (Sphinx)</option>
          </select>
        </div>

        <!-- Disguise Mode Switcher -->
        <div class="disguise-mode-wrapper desktop-only">
          <select id="disguise-mode-select" class="theme-select disguise-select" title="排版伪装风格">
            <option value="hybrid">混合文档模式 (推荐)</option>
            <option value="clean">纯净文档模式</option>
            <option value="code_dense">代码密集模式</option>
          </select>
        </div>

        <!-- Book Selector Dropdown -->
        <div class="book-picker-wrapper desktop-only">
          <select id="book-select" class="theme-select book-select" title="切换书目">
            <option value="">载入中...</option>
          </select>
        </div>

        <!-- Dark / Light Mode Switcher -->
        <button id="dark-mode-toggle" class="theme-toggle-btn" aria-label="Toggle dark mode" title="切换深色/浅色模式">
          <div class="toggle-track">
            <div class="toggle-thumb">
              <svg class="sun-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
              <svg class="moon-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
          </div>
        </button>

        <!-- Panic / Boss Mode Button -->
        <button id="boss-key-btn" class="boss-btn" title="老板键：一键切换官方真文档 (快捷键: b 或 Esc)">
          <span class="boss-icon">🛡️</span>
          <span class="boss-label desktop-only">Boss [b]</span>
        </button>

        <!-- Social Links Placeholder -->
        <div class="social-icons desktop-only">
          <a href="https://github.com" target="_blank" class="social-link" rel="noreferrer" title="GitHub">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
          </a>
        </div>
      </div>
    </header>

    <!-- Main Container (Left Sidebar + Content + Right TOC) -->
    <div class="main-wrapper">
      
      <!-- Left Sidebar (Chapter Navigation Tree) -->
      <aside id="sidebar-left" class="sidebar sidebar-left">
        
        <!-- Vue-specific API Style Preference Toggle -->
        <div id="vue-api-preference" class="api-preference-box">
          <div class="pref-label-row">
            <span class="pref-label">API 风格偏好</span>
            <span class="pref-collapse">⌃</span>
          </div>
          <div class="pref-toggle-row">
            <div class="pref-pills">
              <button class="pref-btn" id="pref-options">选项式</button>
              <button class="pref-btn active" id="pref-composition">组合式</button>
            </div>
            <span class="pref-help-icon" title="在选项式 API 与组合式 API 之间切换">?</span>
          </div>
        </div>

        <!-- Disguise Title Toggle -->
        <div class="sidebar-meta-row">
          <span class="sidebar-section-count" id="chapter-count-badge">共 0 节</span>
          <button id="toggle-chapter-naming" class="text-btn" title="切换小说章节名与伪装API名">
            <span id="naming-mode-label">伪装命名: 开</span>
          </button>
        </div>

        <!-- Chapter Links Tree -->
        <nav id="chapter-tree" class="nav-tree">
          <div class="nav-group">
            <div class="nav-group-title">基础文档</div>
            <ul class="nav-group-list" id="chapter-list">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </nav>
      </aside>

      <!-- Center Main Content -->
      <main id="content-main" class="content-container">
        
        <!-- Panic Boss Banner (visible only during boss mode) -->
        <div id="boss-banner" class="boss-banner hidden">
          <span>🛡️ 已进入官方技术文档脱险模式 (按 <strong>b</strong> 或 <strong>Esc</strong> 恢复小说)</span>
        </div>

        <article id="doc-article" class="doc-article">
          <!-- Page Header -->
          <header class="doc-header">
            <div class="breadcrumbs" id="doc-breadcrumbs">
              <span>文档</span> <span class="sep">/</span> <span>基础</span> <span class="sep">/</span> <span class="current" id="crumb-current">响应式基础</span>
            </div>
            <h1 id="article-title" class="article-h1">响应式基础</h1>
          </header>

          <!-- Dynamic Blocks Container (Paragraphs, Callouts, Code Blocks) -->
          <div id="doc-blocks" class="doc-blocks">
            <div class="loading-state">正在载入文档内容...</div>
          </div>

          <!-- Bottom Navigation (Prev / Next Chapter) -->
          <footer class="doc-footer">
            <div class="footer-nav">
              <a href="#" id="prev-chapter-btn" class="footer-nav-link prev hidden">
                <span class="nav-sub">← 上一页</span>
                <span class="nav-title" id="prev-chapter-title">上一章</span>
              </a>
              <a href="#" id="next-chapter-btn" class="footer-nav-link next hidden">
                <span class="nav-sub">下一页 →</span>
                <span class="nav-title" id="next-chapter-title">下一章</span>
              </a>
            </div>
            <div class="footer-meta">
              <span>最后编辑于 2026-09-01</span>
              <span>帮助我们改善此页面</span>
            </div>
          </footer>
        </article>
      </main>

      <!-- Right Sidebar (On This Page TOC + Sponsors) -->
      <aside id="sidebar-right" class="sidebar sidebar-right desktop-only">
        <div class="toc-container">
          <div class="toc-title" id="toc-header-title">本页目录</div>
          <ul id="toc-list" class="toc-list">
            <!-- Dynamically populated -->
          </ul>

          <!-- Sponsor Placeholder (Pixel-perfect matching Vue screenshot) -->
          <div class="sponsor-box">
            <div class="sponsor-title">赞助位</div>
            <div class="sponsor-card">
              <span class="sponsor-text">成为赞助商</span>
            </div>
            <div class="sponsor-banner-mock">
              <div class="sponsor-inner">
                <span class="mock-tag">PARTNER</span>
                <span class="mock-desc">AI 智能辅助与企业级开发套件</span>
              </div>
            </div>
          </div>
        </div>
      </aside>

    </div>

    <!-- Quick Search Modal (⌘K) -->
    <div id="search-modal" class="modal-backdrop hidden">
      <div class="modal-card">
        <div class="modal-search-input-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="modal-search-input" placeholder="搜索文档、章节或快速跳转..." autocomplete="off">
          <kbd class="modal-kbd">ESC</kbd>
        </div>
        <div id="search-results-list" class="search-results-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>

</html>
